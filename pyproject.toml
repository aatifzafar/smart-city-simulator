[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-city-simulator"
version = "1.0.0"
description = "Mini Smart City Simulator - Advanced Object-Oriented Urban Simulation"
readme = "README.md"
authors = [{ name = "Smart City Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8.0",
    "pytest>=7.0.0",
]

[project.scripts]
smart-city-sim = "smart_city_simulator.main:main"

[tool.pytest.ini_options]
testpaths = ["smart_city_simulator/tests"]
python_files = ["test_*.py"]
